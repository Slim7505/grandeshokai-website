<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Grande Shokai Co., Ltd.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="{{ root }}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}assets/css/site.css">
</head>
<body class="chooser">
<main class="chooser-main">
  <svg class="chooser-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M38 14.5A16 16 0 1 0 40 26H25" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="10" r="4.2" fill="#d98e1f"/></svg>
  <p class="display display-md">404</p>
  {% for l in langs %}
  <p lang="{{ l }}"><strong>{{ strings[l].notfound.title }}</strong> — {{ strings[l].notfound.text }}</p>
  {% endfor %}
  <ul class="chooser-list">
    {% for l in langs %}<li><a href="{{ root }}{{ l }}/" hreflang="{{ l }}" lang="{{ l }}">{{ site.lang_label[l] }}</a></li>{% endfor %}
  </ul>
</main>
</body>
</html>
